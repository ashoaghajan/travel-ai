name: Keep Render service warm

on:
  # Ten-minute cadence stays below Render Free's 15-minute idle spin-down.
  # Skip minute 0 to avoid GitHub's busiest scheduled-workflow window.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-health-ping
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public API health
        shell: bash
        run: |
          set -euo pipefail
          url="https://travel-ai-io1t.onrender.com/api/health"
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 75 "$url" || true)
            if [[ "$status" == "200" ]] && node -e "const x=require('/tmp/health.json'); process.exit(x.status === 'ok' ? 0 : 1)"; then
              echo "Render health check passed (attempt $attempt)."
              exit 0
            fi
            echo "Health check attempt $attempt did not return a healthy response (HTTP ${status:-no response})."
            if [[ "$attempt" != "3" ]]; then sleep 15; fi
          done
          echo "Render health check failed after retries."
          exit 1
