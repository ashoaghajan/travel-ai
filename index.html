<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d3fef" />
    <!--
      Paints the look before the first frame.

      This has to be inline and blocking: a module script is deferred, so by the
      time `useAppliedTheme` runs, a dark-ground reader has already been shown a
      white page.

      Two attributes now, not one. `sharpen` on a light ground is the
      document's default, so the only work is writing anything that differs.

      `src/services/theme.service.ts` is the source of truth for this logic and
      for the `theme-color` table — the duplication is deliberate and both
      copies must resolve alike.
    -->
    <script>
      (function () {
        var CHROME = {
          sharpen: { light: '#6d3fef', dark: '#0f1117' },
          atlas: { light: '#fdfcf9', dark: '#17150f' },
          console: { light: '#f4f5f8', dark: '#101318' },
        };

        try {
          var stored = JSON.parse(localStorage.getItem('ai-travel-planner:settings') || 'null');
          var appearance = (stored && stored.theme) || 'sharpen';

          // Records written before the appearances existed hold 'system',
          // 'light' or 'dark'. They were all being shown Sharpen already.
          if (!CHROME[appearance]) appearance = 'sharpen';

          var ground = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

          if (appearance !== 'sharpen') document.documentElement.dataset.appearance = appearance;
          if (ground === 'dark') document.documentElement.dataset.theme = 'dark';

          document.querySelector('meta[name="theme-color"]').content = CHROME[appearance][ground];
        } catch {
          // Blocked storage or an unparseable record: the default is the safe answer.
        }
      })();
    </script>
    <meta
      name="description"
      content="AI Travel Planner — plan the perfect trip in minutes. Customised. Smart. Effortless."
    />

    <!--
      The link preview a scraper builds when this URL is pasted into LinkedIn,
      Slack or a message. None of it is read by the app.

      Absolute URLs, not paths: a scraper resolves these against nothing, so a
      leading-slash path yields no image at all. Update the origin here if the
      deployment ever moves off Render.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Travel Planner" />
    <meta property="og:title" content="AI Travel Planner — describe a trip, get an itinerary" />
    <meta
      property="og:description"
      content="Full-stack AI trip planner: React + TypeScript web client, Node/Express API on PostgreSQL, and an Expo React Native app sharing one core."
    />
    <meta property="og:url" content="https://travel-ai-io1t.onrender.com/" />
    <meta property="og:image" content="https://travel-ai-io1t.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="AI Travel Planner — React, TypeScript, Node.js, PostgreSQL, React Native" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AI Travel Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
